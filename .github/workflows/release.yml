# Release pipeline (Vision.md §69).
#
# Two ways in:
#   * push a semantic version tag, e.g. `v0.42.8`; or
#   * run it manually from the Actions tab, which builds the current head of
#     the default branch and creates the tag from pubspec.yaml itself.
#
# Builds both platform artifacts, verifies them, and publishes a public GitHub
# Release. Never publishes a pre-release or a draft.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to release. Defaults to the current head of the default branch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.1
  FLUTTER_CHANNEL: stable
  APP_COMMIT: ${{ github.sha }}

jobs:
  android-10-integration:
    name: Android 10 portfolio journey
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run portfolio journey on API 29
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-boot-timeout: 600
          script: flutter test integration_test/portfolio_journey_test.dart -d emulator-5554

  release:
    name: Build and publish
    needs: android-10-integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only this job may write to the repository, and only to create the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        run: |
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          semver="${pubspec_version%%+*}"
          build_number="${pubspec_version##*+}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            # A tag that disagrees with pubspec.yaml would ship artifacts
            # labelled with the wrong version (Vision.md §69).
            if [[ "v${semver}" != "${tag}" ]]; then
              echo "::error::Tag ${tag} does not match pubspec version ${semver} (expected v${semver})."
              exit 1
            fi
          else
            # Manual run: the version in pubspec.yaml is the source of truth and
            # the tag is created from it, so releasing needs no local git work.
            tag="v${semver}"
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists. Bump the version in pubspec.yaml before releasing again."
              exit 1
            fi
          fi

          previous="$(git describe --tags --abbrev=0 --exclude="${tag}" 2>/dev/null || true)"

          {
            echo "tag=${tag}"
            echo "semver=${semver}"
            echo "build_number=${build_number}"
            echo "previous_tag=${previous}"
            echo "create_tag=${{ github.event_name == 'workflow_dispatch' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${semver}+${build_number} as ${tag} (previous: ${previous:-none})"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev xauth xvfb

      # The same gate developers run locally: format, analyze, test, the
      # Android 10 assertion, and both release builds.
      - name: Run the full local pipeline
        run: ./localPipeline.sh

      - name: Collect artifacts
        id: artifacts
        run: |
          version="${{ steps.version.outputs.semver }}"
          mkdir -p dist

          # The APK is published as-is, not archived: Android installs it
          # directly and an archive would only add a step for the user.
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/dividendendackel-${version}-android.apk"

          # A Flutter Linux build is a directory, so the single-file direct
          # download is an AppImage: chmod +x and run, no extraction, no root.
          curl -sfL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          APPIMAGETOOL=/tmp/appimagetool.AppImage \
            ./tool/build-appimage.sh "${version}" dist

          # The tarball stays for anyone who wants the plain bundle.
          tar -czf "dist/dividendendackel-${version}-linux-x86_64.tar.gz" \
              -C build/linux/x64/release/bundle .

          cd dist
          sha256sum ./* > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Generate release notes
        run: |
          ./tool/release-notes.sh \
            "${{ steps.version.outputs.semver }}" \
            "${{ steps.version.outputs.previous_tag }}" > RELEASE_NOTES.md

          version="${{ steps.version.outputs.semver }}"
          {
            echo
            echo '### Build metadata'
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${version}+${{ steps.version.outputs.build_number }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Built | \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\` |"
            echo "| Flutter | \`${FLUTTER_VERSION}\` (${FLUTTER_CHANNEL}) |"
            echo "| Android | \`minSdk 29\` / \`targetSdk 36\` |"
            echo
            echo '### Checksums'
            echo
            echo '```'
            sed 's|\./||' dist/SHA256SUMS
            echo '```'
          } >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # On a manual run the tag does not exist yet; create it on the exact
          # commit that was built and tested, not on a moving branch ref.
          target_commitish: ${{ github.sha }}
          name: DividendenDackel ${{ steps.version.outputs.semver }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/dividendendackel-${{ steps.version.outputs.semver }}-android.apk
            dist/DividendenDackel-${{ steps.version.outputs.semver }}-x86_64.AppImage
            dist/dividendendackel-${{ steps.version.outputs.semver }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
