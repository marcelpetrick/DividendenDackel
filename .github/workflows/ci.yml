# Pull-request quality gate (Vision.md §68).
#
# Every job runs ./localPipeline.sh, the same script developers run locally, so
# the local gate and CI cannot drift apart. The stages are split across jobs
# only to get parallel feedback.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Vision.md §73: workflows run with the least privilege they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vision.md §70: checks must not build with an arbitrary "latest" SDK.
  # Keep in sync with localPipeline.sh and CONTRIBUTING.md.
  FLUTTER_VERSION: 3.47.1
  FLUTTER_CHANNEL: stable
  APP_COMMIT: ${{ github.sha }}

jobs:
  version-scheme:
    name: Version scheme
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check compares each new commit against its parent, so it needs
          # more than a shallow clone.
          fetch-depth: 0

      # Every commit must move the version exactly one step, per
      # docs/releases.md. This was a convention until it drifted and two
      # feature commits shipped under one version.
      - name: Check the version bump of each new commit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch reports an all-zero before-SHA; nothing to compare to.
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "${base}" >/dev/null; then
            echo "No comparable base ref; skipping."
            exit 0
          fi
          ./tool/check-version.sh "${base}" "${GITHUB_SHA}"

  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Restore pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Run local pipeline (quality stage)
        run: ./localPipeline.sh --noRun --stage quality

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Vision.md §58: this stage asserts minSdk is still 29 before it builds.
      - name: Run local pipeline (android stage)
        run: ./localPipeline.sh --noRun --stage android

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dividend-tracker-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

  android-10-integration:
    name: Android 10 portfolio journey
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run portfolio journey on API 29
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-boot-timeout: 600
          script: flutter test integration_test/portfolio_journey_test.dart -d emulator-5554

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev xauth xvfb

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Run local pipeline (linux stage)
        run: ./localPipeline.sh --stage linux

      - name: Run real Linux portfolio journey
        run: xvfb-run -a ./localPipeline.sh --noRun --stage integration

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dividend-tracker-linux-x86_64
          path: build/linux/x64/release/bundle
          retention-days: 7
          if-no-files-found: error
