# Static analysis configuration for DividendenDackel.
#
# Vision.md 67 asks for strict static analysis; warnings are not routinely
# ignored, so the analyzer is configured to treat the important ones as errors.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Dead or unreachable code is a bug, not a style preference.
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_element: error
    # Async correctness (Vision.md 66 lists async behaviour as a review item).
    unawaited_futures: error
    discarded_futures: error
    # Domain code must not silently lose type information.
    argument_type_not_assignable: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Drift's recorded schema snapshots, emitted by `drift_dev schema
    # generate`. Hand-editing them would defeat their purpose.
    - "test/data/database/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - join_return_with_assignment
    - only_throw_errors
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_enums
    - use_string_buffers
